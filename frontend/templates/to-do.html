<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            background:#fff;
            width:380px;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:10px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        input[type="text"],
        input[type="password"]{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
            transition:.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus{
            border-color:#4facfe;
            outline:none;
            box-shadow:0 0 8px rgba(79,172,254,.4);
        }

        input[type="submit"]{
            width:100%;
            padding:12px;
            background:#4facfe;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
            transition:.3s;
        }

        input[type="submit"]:hover{
            background:#008cff;
            transform:translateY(-2px);
        }

        @media(max-width:450px){
            .container{
                width:90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>To-Do Form</h1>

        <p>Add a new task item to your list.</p>

        <form action="/api" method="POST">

            <div class="form-group">
                <label for="item_name">Item Name</label>
                <input
                    type="text"
                    id="item_name"
                    name="item_name"
                    placeholder="Enter item name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="item_description">Item Description</label>
                <input
                    type="text"
                    id="item_description"
                    name="item_description"
                    placeholder="Enter item description"
                    required
                >
            </div>

            <input type="submit" value="Add Task">

        </form>

    </div>

</body>
</html>
